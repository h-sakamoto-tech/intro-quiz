<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>イントロクイズ - スクリーン</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07091a; color: #fff;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
  body { display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 50% -20%, #2b1260 0%, #0d1030 45%, #05060f 100%); }
  [hidden] { display: none !important; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 1.4vh 3vw; height: 7vh;
    background: rgba(255,255,255,.04); border-bottom: .2vh solid rgba(255,255,255,.08); }
  #title { font-size: 3.2vh; font-weight: 800; letter-spacing: .12em; }
  #joinInfo { font-size: 2.6vh; opacity: .85; }

  /* ===== 待機画面 ===== */
  #idle { flex: 1; display: flex; gap: 4vw; padding: 4vh 4vw; align-items: center; min-height: 0; }
  .qrbox { background: #fff; border-radius: 2vh; padding: 3vh; text-align: center; color: #111; flex: none; }
  #qr { width: 46vh; height: 46vh; }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; }
  .qrcap { margin-top: 2vh; font-size: 3vh; font-weight: 800; line-height: 1.4; }
  .idleRight { flex: 1; display: flex; flex-direction: column; gap: 2.5vh; min-width: 0; }
  #idleHeadline { font-size: 6.5vh; font-weight: 900;
    background: linear-gradient(90deg, #ffe066, #ff7a59); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #idleSub { font-size: 2.6vh; opacity: .8; }
  #teamChips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.4vh; }
  .chip { padding: 1.8vh 1vw; border-radius: 1.2vh; background: rgba(47,208,122,.15); border: .3vh solid #2fd07a;
    text-align: center; font-size: 2.6vh; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .no { display: inline-block; min-width: 1.9em; padding: 0 .35em; margin-right: .4em; border-radius: .5em; font-size: .78em; line-height: 1.5;
    text-align: center; vertical-align: .08em; background: rgba(255,255,255,.18); font-family: "SF Mono", Menlo, Consolas, monospace; }
  .chip .no { background: #2fd07a; color: #052b16; }
  .tile.r1 .no, .tile.r2 .no, .tile.r3 .no { background: rgba(0,0,0,.22); }
  .chip { text-align: left !important; }
  .noteam { grid-column: 1 / -1; font-size: 3vh; opacity: .5; padding: 3vh 0; }

  /* ===== 出題中 ===== */
  #live { flex: 1; display: flex; flex-direction: column; padding: 1.5vh 2.5vw 2vh; min-height: 0; position: relative; }
  #hero { display: flex; align-items: center; gap: 2.5vw; height: 15vh; }
  #roundNo { font-size: 11vh; font-weight: 900; line-height: 1; letter-spacing: .02em;
    background: linear-gradient(180deg, #fff6b0 0%, #ffcc33 45%, #ff7a00 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 2.2vh rgba(255,170,0,.55)); }
  #badge { font-size: 3.2vh; font-weight: 900; padding: 1vh 2.2vw; border-radius: 99px; white-space: nowrap; }
  #badge.open { background: linear-gradient(90deg, #ff2d55, #ff7a00); box-shadow: 0 0 3vh rgba(255,60,60,.6); animation: blink 1s infinite; }
  #badge.closed { background: #3c4366; }
  @keyframes blink { 50% { opacity: .55; } }
  #timer { margin-left: auto; font-size: 9vh; font-weight: 900; font-variant-numeric: tabular-nums;
    font-family: "SF Mono", Menlo, Consolas, monospace; text-shadow: 0 0 2vh rgba(120,180,255,.5); }
  #timer small { font-size: 4vh; margin-left: .4vw; opacity: .7; }

  #tiles { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 12.6vh; gap: 1.4vh;
    align-content: start; margin-top: 1vh; }
  .tile { position: relative; border-radius: 1.6vh; padding: 3.6vh 1vw 1vh; display: flex; flex-direction: column; justify-content: center;
    background: linear-gradient(160deg, #1f2a5a, #141a3a); border: .25vh solid rgba(140,170,255,.25); overflow: hidden;
    animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .tile .rk { position: absolute; top: .7vh; left: .9vw; font-size: 2.4vh; font-weight: 900; opacity: .9; }
  .tile .nm { font-size: 3.3vh; font-weight: 900; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .tm { font-size: 2.8vh; font-weight: 800; text-align: center; font-family: "SF Mono", Menlo, Consolas, monospace; color: #9fd0ff; }
  .tile.r1 { grid-column: span 2; grid-row: span 2; border: .5vh solid #ffe27a;
    background: linear-gradient(150deg, #ffd34d 0%, #ff9f1a 55%, #e25c00 100%); color: #2a1300;
    box-shadow: 0 0 4vh rgba(255,190,40,.7); animation: pop .6s cubic-bezier(.2,1.6,.4,1), glow 1.2s ease-in-out .6s infinite; }
  .tile.r1 .rk { font-size: 5vh; top: 1.2vh; left: 1.4vw; }
  .tile.r1 { padding-top: 7vh; }
  .tile.r1 .nm { font-size: 7vh; }
  .tile.r1 .tm { font-size: 5.5vh; color: #3a1800; }
  .tile.r1 .mic { position: absolute; top: 1.4vh; right: 1.2vw; font-size: 2.6vh; font-weight: 900; background: #2a1300; color: #ffd34d;
    padding: .5vh 1.2vw; border-radius: 99px; }
  .tile.r2 { background: linear-gradient(150deg, #eef2f7, #9aa5b5); color: #1b2230; border-color: #fff; }
  .tile.r2 .tm, .tile.r3 .tm { color: inherit; }
  .tile.r3 { background: linear-gradient(150deg, #f0a46b, #a0522d); color: #2a1206; border-color: #ffc59a; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes glow { 50% { box-shadow: 0 0 7vh rgba(255,210,60,1); } }
  #waitMsg { grid-column: 1 / -1; grid-row: span 4; display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 6vh; font-weight: 900; line-height: 1.5; animation: breathe 1.6s ease-in-out infinite; }
  #waitMsg em { font-style: normal; color: #ff4b5c; }
  @keyframes breathe { 50% { opacity: .45; transform: scale(.97); } }

  #reveal { position: absolute; left: 2.5vw; right: 2.5vw; bottom: 2vh; display: flex; align-items: center; gap: 2vw; padding: 2vh 3vw; border-radius: 1.8vh;
    background: linear-gradient(90deg, #ffcf3f, #ff8a00); color: #2a1600; box-shadow: 0 0 5vh rgba(255,170,0,.6); animation: pop .5s ease-out; z-index: 3; }
  #reveal span { font-size: 3.6vh; font-weight: 900; background: #2a1600; color: #ffcf3f; padding: .6vh 1.6vw; border-radius: 99px; flex: none; }
  #reveal b { font-size: 7vh; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ===== スタート演出 ===== */
  #burst { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(5,6,15,.82); pointer-events: none; overflow: hidden; }
  #burst::before { content: ""; position: absolute; width: 250vmax; height: 250vmax; left: 50%; top: 50%; margin: -125vmax 0 0 -125vmax;
    background: repeating-conic-gradient(rgba(255,200,40,.22) 0 8deg, transparent 8deg 18deg); animation: spin 6s linear infinite; }
  #burst .bq { position: relative; font-size: 24vh; font-weight: 900; line-height: 1;
    background: linear-gradient(180deg, #fff6b0, #ffcc33 45%, #ff6a00); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 4vh rgba(255,160,0,.8)); animation: zoomIn .6s cubic-bezier(.2,1.8,.4,1) both; }
  #burst .bs { position: relative; font-size: 15vh; font-weight: 900; letter-spacing: .15em; color: #fff;
    text-shadow: 0 0 3vh #ff2d55, 0 0 7vh #ff2d55; animation: zoomIn .6s cubic-bezier(.2,1.8,.4,1) .25s both; }
  #burst.out { animation: fadeOut .5s ease forwards; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes zoomIn { from { transform: scale(3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }

  /* ===== 終了画面 ===== */
  #finish { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  #finish::before { content: ""; position: absolute; width: 250vmax; height: 250vmax; left: 50%; top: 50%; margin: -125vmax 0 0 -125vmax;
    background: repeating-conic-gradient(rgba(255,200,40,.14) 0 8deg, transparent 8deg 18deg); animation: spin 14s linear infinite; }
  #finish .ft { position: relative; font-size: 20vh; font-weight: 900; line-height: 1.1;
    background: linear-gradient(180deg, #fff6b0, #ffcc33 45%, #ff6a00); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 4vh rgba(255,160,0,.8)); animation: zoomIn .8s cubic-bezier(.2,1.8,.4,1) both; }
  #finish .fs { position: relative; font-size: 6vh; font-weight: 900; margin-top: 3vh; text-shadow: 0 0 3vh #ff2d55;
    animation: zoomIn .8s cubic-bezier(.2,1.8,.4,1) .3s both; }
  #finish .fn { position: relative; font-size: 3.4vh; margin-top: 2.5vh; opacity: .8; animation: zoomIn .8s ease .6s both; }
  .confetti { position: absolute; top: -5vh; width: 1.4vh; height: 2.4vh; border-radius: .3vh; animation: fall linear infinite; opacity: .9; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }

  #starter { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2vh; font-size: 4vh; cursor: pointer; z-index: 10; }
  #starter small { font-size: 2.4vh; opacity: .7; }
  #conn { position: fixed; left: 1vw; bottom: 1vh; font-size: 1.8vh; color: #ff7b7b; }
</style>
</head>
<body>
  <header>
    <div id="title">イントロクイズ</div>
    <div id="joinInfo"></div>
  </header>

  <section id="idle" hidden>
    <div class="qrbox" id="qrBox">
      <div id="qr"></div>
      <div class="qrcap">チーム代表者は<br>スマホで読み取り！</div>
    </div>
    <div class="idleRight">
      <div id="idleHeadline">参加受付中</div>
      <div id="idleSub">QRを読み取って、チーム名を登録してください</div>
      <div id="teamChips"></div>
    </div>
  </section>

  <section id="live" hidden>
    <div id="hero">
      <div id="roundNo"></div>
      <div id="badge"></div>
      <div id="timer">0.00<small>秒</small></div>
    </div>
    <div id="tiles"></div>
    <div id="reveal" hidden><span>正解</span><b id="revealText"></b></div>
  </section>

  <section id="finish" hidden>
    <div id="confettiBox"></div>
    <div class="ft">クイズ終了！</div>
    <div class="fs">ご参加ありがとうございました！</div>
    <div class="fn" id="finishNote"></div>
  </section>

  <div id="burst" hidden><div class="bq" id="burstQ"></div><div class="bs">START!</div></div>
  <div id="starter">クリックして開始（効果音ON）<small>ブラウザを全画面表示（F11）にしてください</small></div>
  <div id="conn" hidden>再接続中…</div>

<script>
/* =========================================================
 * イントロクイズ 共通設定（Firebase Realtime Database）
 *
 * Firebase プロジェクト: intro-quiz-bf88f（設定済み）
 * Firebase コンソール →（歯車）プロジェクトの設定 → マイアプリ →
 * 「SDK の設定と構成」の firebaseConfig の中身を、下の { } に貼り付けます。
 * databaseURL が入っていることを確認してください。
 * ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBTJj_f35gAGVCe7nEyCOHKEwmwXMKn5v0",
  authDomain: "intro-quiz-bf88f.firebaseapp.com",
  databaseURL: "https://intro-quiz-bf88f-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "intro-quiz-bf88f",
  storageBucket: "intro-quiz-bf88f.firebasestorage.app",
  messagingSenderId: "326197546643",
  appId: "1:326197546643:web:f8ce4c781f82c1eff94766"
};
/* ▲▲▲ ここまで ▲▲▲ */

const TEAM_COUNT = 20;
const DEFAULT_TITLE = 'イントロクイズ大会';

if (!/^https:\/\//.test(FIREBASE_CONFIG.databaseURL || '')) {
  document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML = '<div style="padding:24px;font:16px sans-serif;color:#fff;background:#b00020">' +
      'common.js の FIREBASE_CONFIG が未設定です。Firebase の設定（databaseURL を含む）を貼り付けてください。</div>';
  });
  throw new Error('FIREBASE_CONFIG not set');
}
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const ROOT = db.ref('introquiz');
const TS = firebase.database.ServerValue.TIMESTAMP;

/* サーバー時刻との差（Firebase が自動測定）。押下時刻の補正に使う */
let serverOffset = 0;
db.ref('.info/serverTimeOffset').on('value', function (s) { serverOffset = s.val() || 0; });
function serverNow() { return Date.now() + serverOffset; }

function onConnection(cb) {
  db.ref('.info/connected').on('value', function (s) { cb(!!s.val()); });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function sec(ms) { return (Math.max(0, ms) / 1000).toFixed(2); }

function defaultState() {
  return { title: DEFAULT_TITLE, roundNo: 0, status: 'idle', startAt: 0, endAt: 0, showQr: true, reveal: '' };
}

/** teams オブジェクト → [{id, name, device, joined}] (1..TEAM_COUNT) */
function teamList(teamsObj) {
  const out = [];
  for (let i = 1; i <= TEAM_COUNT; i++) {
    const t = (teamsObj && teamsObj[i]) || {};
    out.push({ id: i, name: t.name || ('チーム' + i), device: t.device || '', joined: !!t.device });
  }
  return out;
}

/**
 * 押下記録 → 順位
 *  ms = 押した瞬間の補正済み時刻 − 開始時刻
 *  不正・時計ズレ対策で 0 〜（サーバー受信時刻 − 開始時刻）にクランプ
 */
function computeRanking(buzzesObj, startAt, teams) {
  const names = {};
  (teams || []).forEach(function (t) { names[t.id] = t.name; });
  return Object.keys(buzzesObj || {}).map(function (tid) {
    const b = buzzesObj[tid] || {};
    let ms = Number(b.at) - startAt;
    const recv = Number(b.recv) || 0;
    if (recv) ms = Math.min(ms, recv - startAt);
    if (!isFinite(ms)) ms = recv ? recv - startAt : 0;
    return { teamId: Number(tid), name: names[tid] || ('チーム' + tid), ms: Math.max(0, Math.round(ms)), recv: recv };
  }).sort(function (a, b) { return (a.ms - b.ms) || (a.recv - b.recv); });
}

/** このページのフォルダURL（QRコード用） */
function baseUrl() {
  return location.href.split('#')[0].split('?')[0].replace(/[^/]*$/, '');
}

</script>
<script>
  const $ = function (id) { return document.getElementById(id); };
  const APP_URL = baseUrl();
  let state = defaultState(), teams = teamList({}), buzzes = {};
  let subRound = null, buzzRef = null, lastBuzzCount = 0, lastRound = -1, tilesSig = '', chipsSig = '';
  let audio = null, firstState = true, burstTimer = null, prevStatus = null, prevRound = null;

  if (typeof QRCode !== 'undefined') {
    new QRCode($('qr'), { text: APP_URL, width: 600, height: 600, correctLevel: QRCode.CorrectLevel.M });
  } else { $('qr').textContent = APP_URL; }

  /* ---- 効果音 ---- */
  function tone(freq, start, dur, type, vol) {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + start;
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t); o.stop(t + dur);
  }
  function fanfare() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.11, i === 3 ? 0.6 : 0.14, 'square', 0.13); }); }
  function buzzSound(first) { if (first) { tone(1320, 0, 0.18); tone(1760, 0.16, 0.35); } else tone(880, 0, 0.12, 'triangle', 0.2); }
  $('starter').addEventListener('click', function () {
    try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
    try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); } catch (e) {}
    $('starter').hidden = true;
    tone(880, 0, 0.15);
  });

  /* ---- 終了演出 ---- */
  let finishShown = false;
  function makeConfetti() {
    const colors = ['#ffd34d', '#ff4b5c', '#2fd07a', '#4da3ff', '#ff9f1a', '#c86bff'];
    let html = '';
    for (let i = 0; i < 70; i++) {
      html += '<span class="confetti" style="left:' + (Math.random() * 100) + 'vw;background:' + colors[i % colors.length] +
        ';animation-duration:' + (3 + Math.random() * 4) + 's;animation-delay:' + (-Math.random() * 6) + 's"></span>';
    }
    $('confettiBox').innerHTML = html;
  }

  /* ---- スタート演出 ---- */
  function showBurst(n) {
    $('burstQ').textContent = '第' + n + '問';
    const b = $('burst');
    b.classList.remove('out'); b.hidden = true; void b.offsetWidth; b.hidden = false;
    fanfare();
    clearTimeout(burstTimer);
    burstTimer = setTimeout(function () {
      b.classList.add('out');
      burstTimer = setTimeout(function () { b.hidden = true; b.classList.remove('out'); }, 500);
    }, 1900);
  }

  /* ---- データ購読 ---- */
  onConnection(function (ok) { $('conn').hidden = ok; });
  ROOT.child('state').on('value', function (s) {
    state = Object.assign(defaultState(), s.val() || {});
    if (!firstState && state.status === 'open' && (prevStatus !== 'open' || prevRound !== state.roundNo)) showBurst(state.roundNo);
    firstState = false; prevStatus = state.status; prevRound = state.roundNo;
    if (subRound !== state.roundNo) {
      if (buzzRef) buzzRef.off();
      subRound = state.roundNo; buzzes = {};
      buzzRef = ROOT.child('buzzes/' + state.roundNo);
      buzzRef.on('value', function (b) { buzzes = b.val() || {}; render(); });
    }
    render();
  });
  ROOT.child('teams').on('value', function (s) { teams = teamList(s.val()); tilesSig = ''; render(); });

  /* ---- 描画 ---- */
  function render() {
    const s = state;
    $('title').textContent = s.title;
    document.title = s.title + ' - スクリーン';
    const joinedTeams = teams.filter(function (t) { return t.joined; });
    $('joinInfo').textContent = '参加 ' + joinedTeams.length + ' チーム';

    if (s.status === 'finished') {
      $('idle').hidden = true; $('live').hidden = true; $('finish').hidden = false;
      $('finishNote').textContent = s.roundNo > 0 ? '全 ' + s.roundNo + ' 問 ／ 参加 ' + joinedTeams.length + ' チーム' : '';
      if (!finishShown) { finishShown = true; makeConfetti(); fanfare(); }
      return;
    }
    finishShown = false; $('finish').hidden = true;
    if (s.status === 'idle') {
      $('live').hidden = true; $('idle').hidden = false;
      $('qrBox').hidden = !s.showQr;
      $('idleHeadline').textContent = s.roundNo === 0 ? '参加受付中' : '第' + (s.roundNo + 1) + '問  まもなくスタート';
      const sig = JSON.stringify(joinedTeams.map(function (t) { return t.name; }));
      if (sig !== chipsSig) {
        chipsSig = sig;
        $('teamChips').innerHTML = joinedTeams.length ? joinedTeams.map(function (t) {
          return '<div class="chip"><span class="no">' + t.id + '</span>' + esc(t.name) + '</div>';
        }).join('') : '<div class="noteam">まだ参加チームはありません</div>';
      }
      lastBuzzCount = 0;
      return;
    }
    chipsSig = '';

    $('idle').hidden = true; $('live').hidden = false;
    $('roundNo').textContent = '第' + s.roundNo + '問';
    $('badge').className = s.status;
    $('badge').textContent = s.status === 'open' ? 'わかったら押せ！' : '受付終了';
    if (s.reveal && $('reveal').hidden) tone(990, 0, 0.4);
    $('reveal').hidden = !s.reveal;
    $('revealText').textContent = s.reveal || '';

    const ranking = computeRanking(buzzes, s.startAt, teams);
    if (s.roundNo !== lastRound) { lastRound = s.roundNo; lastBuzzCount = 0; tilesSig = ''; }
    if (ranking.length > lastBuzzCount) { buzzSound(lastBuzzCount === 0); lastBuzzCount = ranking.length; }

    const sig = s.roundNo + ':' + s.status + ':' + JSON.stringify(ranking.map(function (r) { return [r.teamId, r.name, r.ms]; }));
    if (sig === tilesSig) return;
    const prevSig = tilesSig;
    tilesSig = sig;

    if (!ranking.length) {
      $('tiles').innerHTML = '<div id="waitMsg">' + (s.status === 'open'
        ? '曲名がわかったら<br><em>「わかった！」</em>ボタン！' : '回答なし') + '</div>';
      return;
    }
    // 既存タイルは再アニメーションさせず、新しく増えたタイルだけポップさせる
    const old = {};
    $('tiles').querySelectorAll('.tile').forEach(function (el) { old[el.dataset.key] = true; });
    $('tiles').innerHTML = ranking.map(function (b, i) {
      const key = b.teamId + '@' + (i + 1);
      const still = prevSig && old[key] ? ' style="animation:' + (i === 0 ? 'glow 1.2s ease-in-out infinite' : 'none') + '"' : '';
      return '<div class="tile r' + (i + 1) + '" data-key="' + key + '"' + still + '>' +
        '<span class="rk">' + (i + 1) + '位</span>' +
        (i === 0 && s.status === 'open' ? '<span class="mic">マイクへ！</span>' : '') +
        '<div class="nm"><span class="no">' + b.teamId + '</span>' + esc(b.name) + '</div>' +
        '<div class="tm">' + sec(b.ms) + '秒</div></div>';
    }).join('');
  }

  function tick() {
    if (state.status !== 'idle' && state.startAt) {
      const ms = state.status === 'open' ? serverNow() - state.startAt : (state.endAt || serverNow()) - state.startAt;
      $('timer').innerHTML = sec(ms) + '<small>秒</small>';
    }
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
